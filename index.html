<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIYA BHAI Tournament</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080b14;
  color:#fff;
  font-family:Arial,sans-serif;
}
header{
  text-align:center;
  padding:25px 10px;
  background:#11172a;
}
header h1{color:#ffb000;margin:0}
.container{padding:15px}
.card{
  background:#12192b;
  padding:18px;
  margin-bottom:15px;
  border-radius:12px;
}
label{
  display:block;
  margin-top:12px;
  margin-bottom:6px;
}
input,select{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #303950;
  background:#080d18;
  color:white;
}
.fee{
  margin-top:15px;
  padding:14px;
  background:#1b243b;
  border-radius:8px;
  text-align:center;
  color:#ffb000;
  font-size:20px;
  font-weight:bold;
}
button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:8px;
  background:#ffb000;
  font-size:16px;
  font-weight:bold;
}
.note{
  color:#bbb;
  line-height:1.6;
}
</style>
</head>

<body>

<header>
  <h1>🔥 MIYA BHAI TOURNAMENT</h1>
  <p>Free Fire Tournament</p>
</header>

<div class="container">

<div class="card">

<h2>🎮 Tournament Registration</h2>

<label>Game Mode</label>
<select id="mode" onchange="updateFee()">
  <option value="">Select Mode</option>
  <option value="Solo">Solo</option>
  <option value="Duo">Duo</option>
  <option value="Squad">Squad</option>
</select>

<div class="fee" id="fee">
  Fee: ৳0
</div>

<label>Player Name</label>
<input id="name" type="text" placeholder="Your Name">

<label>Free Fire UID</label>
<input id="uid" type="text" placeholder="Free Fire UID">

<label>Mobile Number</label>
<input id="phone" type="tel" placeholder="Your Mobile Number">

<label>bKash Transaction ID</label>
<input id="trx" type="text" placeholder="Example: 8A7B6C5D">

<p class="note">
💳 bKash Send Money করুন:<br>
<b>016017905300</b><br><br>
Payment করার পরে Transaction ID উপরের ঘরে দিন।
</p>

<button onclick="submitRegistration()">
  SUBMIT REGISTRATION
</button>

</div>

</div>

<script>

function updateFee(){

  let mode = document.getElementById("mode").value;
  let fee = 0;

  if(mode === "Solo"){
    fee = 100;
  }

  if(mode === "Duo"){
    fee = 50;
  }

  if(mode === "Squad"){
    fee = 40;
  }

  document.getElementById("fee").innerHTML =
    "Fee: ৳" + fee;

}

function submitRegistration(){

  let mode = document.getElementById("mode").value;
  let name = document.getElementById("name").value;
  let uid = document.getElementById("uid").value;
  let phone = document.getElementById("phone").value;
  let trx = document.getElementById("trx").value;

  if(!mode || !name || !uid || !phone || !trx){
    alert("সব তথ্য পূরণ করুন!");
    return;
  }

  alert(
    "Registration Submitted!\\n\\n" +
    "Mode: " + mode +
    "\\nPlayer: " + name +
    "\\nUID: " + uid +
    "\\nTransaction ID: " + trx +
    "\\n\\nAdmin payment verify করার পরে registration confirm করবে।"
  );

}

</script>

</body>
</html>
